name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write        # needed to attach assets on release events

jobs:
  build:
    name: macOS (universal .app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe --tags for the version string
      - name: Install build dependencies
        run: brew install pkgconf sdl3 sdl3_net
      - name: Compile check (debug, -Werror, Homebrew SDL3)
        run: make -j"$(sysctl -n hw.ncpu)" debug
      - name: Smoke test
        run: ./opentyrian --help
      - name: Cache game data
        # Keyed on the data lock's manifest hash (the official Tyrian 2.1 zip
        # fetched by ./get_data.sh), so a manifest change re-downloads and
        # ./get_data.sh is a no-op when the cache hits.
        uses: actions/cache@v6
        with:
          path: data
          key: tyrian21-data-${{ hashFiles('test/regress/data-manifest.txt') }}
      - name: Fetch game data
        run: ./get_data.sh
      - name: Build (release)
        run: |
          make clean
          make -j"$(sysctl -n hw.ncpu)"
      - name: Regression suite
        # Release builds only package: the same commit already passed the suite
        # on its push, and the suite is the slowest step.
        if: github.event_name != 'release'
        # Normal pass; the full --replay-check/--interp-check sweeps live in the
        # manually triggered "Regression (full sweeps)" workflow.
        env:
          REGRESS_SKIP_BUILD: "1"   # built just above with the release flags
        # Case workers default to the runner CPU count (REGRESS_JOBS overrides it).
        run: make regress
      - name: Upload regression output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-actual-macos
          path: test/regress/actual
          if-no-files-found: ignore
      - name: Build OpenTyrian.app (universal, SDL3 + SDL3_net + data)
        run: ./make_macos.sh
      - name: Verify the bundle
        run: |
          lipo -archs build/OpenTyrian.app/Contents/MacOS/opentyrian | grep -q "x86_64 arm64"
          test -f build/OpenTyrian.app/Contents/Resources/data/tyrian1.lvl
          test -d build/OpenTyrian.app/Contents/Frameworks/SDL3.framework
          test -d build/OpenTyrian.app/Contents/Frameworks/SDL3_net.framework
          # the binary must not reference Homebrew - only the bundled frameworks
          if otool -L build/OpenTyrian.app/Contents/MacOS/opentyrian | grep -q /opt/homebrew; then exit 1; fi
      - name: Smoke test the bundle
        run: build/OpenTyrian.app/Contents/MacOS/opentyrian --help
      - name: Zip app (preserving symlinks)
        run: cd build && zip -r -y opentyrian-macos-universal.zip OpenTyrian.app
      - uses: actions/upload-artifact@v7
        with:
          name: opentyrian-macos-universal
          path: build/opentyrian-macos-universal.zip
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          asset="opentyrian-$tag-macos-universal.zip"
          mv build/opentyrian-macos-universal.zip "$asset"
          gh release upload "$tag" "$asset" --clobber
